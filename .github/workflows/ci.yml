name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install X11 test tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip
      - name: Test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: cargo test --workspace
